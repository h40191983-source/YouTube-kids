<title>YouTube Kids</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f8fb;color:#172033}
button,input{font:inherit}
button{cursor:pointer}

.header{
 position:fixed;top:0;left:0;right:0;height:68px;background:#fff;
 border-bottom:1px solid #e5e8ee;display:flex;align-items:center;
 gap:15px;padding:0 20px;z-index:1000
}
.logo{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;min-width:185px}
.logoIcon{width:38px;height:28px;border-radius:8px;background:#ff1744;display:flex;align-items:center;justify-content:center}
.logoIcon:after{content:"";border-left:10px solid white;border-top:6px solid transparent;border-bottom:6px solid transparent}
.logo span{color:#ff1744}

.search{display:flex;flex:1;max-width:700px;gap:8px}
.search input{
 width:100%;height:43px;border:1px solid #d9dee7;border-radius:24px;
 padding:0 17px;outline:none;background:#fafbfc
}
.search input:focus{border-color:#ff1744;background:#fff}
.search button{width:45px;border:0;border-radius:50%;background:#ff1744;color:#fff}

.addTop{margin-left:auto;border:0;background:#fff0f3;color:#ff1744;padding:10px 16px;border-radius:20px;font-weight:700}

.sidebar{
 position:fixed;top:68px;left:0;bottom:0;width:225px;background:#fff;
 border-right:1px solid #e5e8ee;padding:15px 10px;overflow-y:auto;z-index:900
}
.navTitle{padding:10px 13px;color:#9098a7;font-size:11px;font-weight:800;text-transform:uppercase}
.nav{
 width:100%;border:0;background:none;text-align:left;padding:13px;border-radius:11px;
 color:#4d5668;font-weight:700;margin-bottom:3px
}
.nav:hover{background:#f3f5f8}
.nav.active{background:#ffecef;color:#ff1744}

.main{margin-left:225px;padding:90px 28px 40px}

.hero{
 min-height:250px;border-radius:23px;padding:36px;
 background:linear-gradient(135deg,#fff0a8,#ffd9e2,#d0efff);
 position:relative;overflow:hidden;margin-bottom:25px
}
.hero h1{margin:0 0 12px;font-size:38px;max-width:580px}
.hero p{max-width:550px;color:#555f70;line-height:1.6}
.heroEmoji{position:absolute;right:35px;bottom:20px;font-size:82px;animation:float 3s infinite ease-in-out}
@keyframes float{50%{transform:translateY(-12px) rotate(2deg)}}

.head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 13px}
.head h2{margin:0;font-size:23px}
.count{color:#8b94a5;font-size:14px}

.categories{display:flex;gap:8px;overflow:auto;padding-bottom:10px}
.cat{
 border:1px solid #dfe4eb;background:#fff;padding:9px 16px;
 border-radius:22px;white-space:nowrap;color:#596276;font-weight:700
}
.cat.active{background:#ff1744;color:#fff;border-color:#ff1744}

.grid{
 display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:21px
}
.card{
 background:#fff;border:1px solid #e7eaf0;border-radius:15px;
 overflow:hidden;transition:.2s;position:relative
}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 35px #1b274015}
.thumb{position:relative;aspect-ratio:16/9;background:#e8ebf0;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{
 position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 background:#0000;transition:.2s
}
.card:hover .play{background:#00000022}
.play b{
 width:55px;height:55px;border-radius:50%;background:#ff1744;color:#fff;
 display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s
}
.card:hover .play b{opacity:1}
.fav{
 position:absolute;right:9px;top:9px;width:35px;height:35px;border:0;
 border-radius:50%;background:#fff;color:#222;font-size:18px;z-index:5
}
.fav.on{color:#ff1744}
.info{padding:12px}
.title{font-size:15px;font-weight:800;line-height:1.35;min-height:40px}
.channel{font-size:12px;color:#7c8595;margin:7px 0}
.badge{font-size:10px;background:#f0f2f6;color:#687286;padding:5px 8px;border-radius:7px;font-weight:700}

.empty{
 grid-column:1/-1;background:#fff;border:1px dashed #d8dde7;
 border-radius:17px;padding:55px;text-align:center;color:#7b8495
}

.modal{
 position:fixed;inset:0;background:#080d18cc;z-index:2000;
 display:none;align-items:center;justify-content:center;padding:18px
}
.modal.show{display:flex}
.player{
 width:min(1000px,96vw);background:#111827;border-radius:17px;overflow:hidden
}
.playerHead{height:55px;display:flex;align-items:center;justify-content:space-between;color:#fff;padding:0 14px}
.close{
 width:36px;height:36px;border:0;border-radius:50%;
 background:#2b3445;color:#fff;font-size:20px
}
iframe{width:100%;aspect-ratio:16/9;border:0;display:block}

.addBox{
 width:min(500px,95vw);background:#fff;border-radius:20px;padding:25px
}
.addBox h2{margin-top:0}
.addBox p{color:#737d8e;font-size:14px}
.addInput{
 width:100%;height:47px;border:1px solid #d9dee8;border-radius:10px;
 padding:0 13px;outline:none;margin:10px 0 15px
}
.actions{display:flex;justify-content:flex-end;gap:8px}
.btn{border:0;padding:11px 17px;border-radius:10px;font-weight:700}
.cancel{background:#edf0f4;color:#465064}
.confirm{background:#ff1744;color:#fff}

.toast{
 position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);
 background:#172033;color:#fff;padding:12px 18px;border-radius:11px;
 opacity:0;transition:.25s;z-index:3000;font-weight:700
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.mobileMenu{display:none;border:0;background:#f0f2f6;border-radius:9px;width:40px;height:40px}

@media(max-width:1100px){
 .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:800px){
 .mobileMenu{display:block}
 .logo{min-width:auto;font-size:18px}
 .logo span{display:none}
 .addTop{display:none}
 .sidebar{transform:translateX(-100%);transition:.25s}
 .sidebar.open{transform:translateX(0);box-shadow:10px 0 35px #0002}
 .main{margin-left:0;padding:84px 14px 30px}
 .hero{padding:25px}
 .hero h1{font-size:29px}
 .heroEmoji{font-size:60px;right:10px;opacity:.3}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
}
@media(max-width:520px){
 .grid{grid-template-columns:1fr}
 .hero h1{font-size:27px}
}
</style>

<button class="btn cancel" id="addCancel">Cancel</button>

</div>
</div>

/* ==========================================================
   CREATE VIDEO OBJECTS
   ========================================================== */

const videos=[];
const used=new Set();

groups.forEach(group=>{

 const category=group[0];
 const channel=group[1];
 const prefix=group[2];
 const ids=group[3];

 ids.forEach((id,index)=>{

   if(used.has(id)) return;

   used.add(id);

   videos.push({
     id:id,
     title:prefix+" • Kids Video "+(index+1),
     channel:channel,
     category:category,
     tags:(
       prefix+" "+
       channel+" "+
       category+" "+
       "kids children cartoon learning music vehicles cars trucks fire truck police ambulance construction"
     ).toLowerCase()
   });

 });

});


/* ==========================================================
   LOCAL STORAGE
   ========================================================== */

let favorites=
 JSON.parse(localStorage.getItem("ytKidsFavorites")||"[]");

const saved=
 JSON.parse(localStorage.getItem("ytKidsAdded")||"[]");

saved.forEach(v=>{
 if(!used.has(v.id)){
   videos.push(v);
   used.add(v.id);
 }
});


/* ==========================================================
   STATE
   ========================================================== */

let nav="home";
let category="all";
let search="";


/* ==========================================================
   ELEMENTS
   ========================================================== */

const grid=document.getElementById("grid");
const searchInput=document.getElementById("search");
const heading=document.getElementById("heading");
const count=document.getElementById("count");
const playerModal=document.getElementById("playerModal");
const frame=document.getElementById("frame");
const playerTitle=document.getElementById("playerTitle");
const addModal=document.getElementById("addModal");
const toast=document.getElementById("toast");


/* ==========================================================
   RENDER
   ========================================================== */

function render(){

 let list=[...videos];

 if(nav==="vehicles")
   list=list.filter(v=>v.category==="Vehicles");

 if(nav==="kids")
   list=list.filter(v=>v.category==="Kids"||v.category==="Vehicles");

 if(nav==="music")
   list=list.filter(v=>v.category==="Music");

 if(nav==="learning")
   list=list.filter(v=>v.category==="Learning");

 if(nav==="favorites")
   list=list.filter(v=>favorites.includes(v.id));

 if(nav==="trending")
   list=list.slice(0,40);

 if(category!=="all")
   list=list.filter(v=>v.category===category);

 if(search.trim()){

   const q=search.toLowerCase();

   list=list.filter(v=>(
     v.title+" "+
     v.channel+" "+
     v.category+" "+
     v.tags
   ).toLowerCase().includes(q));

 }

 if(nav==="vehicles")
   heading.textContent="🚗 Vehicles";
 else if(nav==="favorites")
   heading.textContent="❤️ Favorites";
 else if(nav==="trending")
   heading.textContent="🔥 Trending";
 else if(nav==="music")
   heading.textContent="🎵 Kids Music";
 else if(nav==="learning")
   heading.textContent="📚 Learning";
 else if(search)
   heading.textContent="🔎 Search Results";
 else
   heading.textContent="Recommended for You";

 count.textContent=list.length+" videos";

 if(!list.length){

   grid.innerHTML=`
   <div class="empty">
     <div style="font-size:45px">🔎</div>
     <h3>No videos found</h3>
     <p>Try another search or category.</p>
   </div>`;

   return;
 }

 grid.innerHTML=list.map(v=>{

   const fav=favorites.includes(v.id);

   return `
   <article class="card">

     <div class="thumb">

       <img
         src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg"
         loading="lazy"
         alt="${escapeHTML(v.title)}"
         onerror="this.src='https://i.ytimg.com/vi/${v.id}/mqdefault.jpg'"
       >

       <button
         class="fav ${fav?"on":""}"
         onclick="favorite('${v.id}',event)">
         ${fav?"♥":"♡"}
       </button>

       <div
         class="play"
         onclick="play('${v.id}')">
         <b>▶</b>
       </div>

     </div>

     <div class="info">

       <div class="title">
         ${escapeHTML(v.title)}
       </div>

       <div class="channel">
         ${escapeHTML(v.channel)}
       </div>

       <span class="badge">
         ${escapeHTML(v.category)}
       </span>

     </div>

   </article>`;
 }).join("");

}


/* ==========================================================
   HTML ESCAPE
   ========================================================== */

function escapeHTML(text){

 return String(text)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


/* ==========================================================
   PLAY
   ========================================================== */

function play(id){

 const v=videos.find(x=>x.id===id);

 if(!v)return;

 playerTitle.textContent=v.title;

 frame.src=
   "https://www.youtube.com/embed/"+
   encodeURIComponent(id)+
   "?autoplay=1&rel=0";

 playerModal.classList.add("show");

}


/* ==========================================================
   CLOSE PLAYER
   ========================================================== */

function closePlayer(){

 playerModal.classList.remove("show");
 frame.src="";

}

document.getElementById("playerClose")
 .onclick=closePlayer;

playerModal.onclick=e=>{
 if(e.target===playerModal)
   closePlayer();
};


/* ==========================================================
   FAVORITES
   ========================================================== */

function favorite(id,e){

 e.stopPropagation();

 if(favorites.includes(id)){

   favorites=favorites.filter(x=>x!==id);
   notify("Removed from Favorites");

 }else{

   favorites.push(id);
   notify("Added to Favorites ❤️");

 }

 localStorage.setItem(
   "ytKidsFavorites",
   JSON.stringify(favorites)
 );

 render();

}


/* ==========================================================
   NAVIGATION
   ========================================================== */

document.querySelectorAll(".nav").forEach(btn=>{

 btn.onclick=()=>{

   document.querySelectorAll(".nav")
    .forEach(x=>x.classList.remove("active"));

   btn.classList.add("active");

   nav=btn.dataset.nav;
   category="all";

   document.querySelectorAll(".cat")
    .forEach(x=>x.classList.remove("active"));

   document.querySelector('.cat[data-cat="all"]')
    .classList.add("active");

   render();

   document.getElementById("sidebar")
    .classList.remove("open");

 };

});


/* ==========================================================
   CATEGORY
   ========================================================== */

document.querySelectorAll(".cat").forEach(btn=>{

 btn.onclick=()=>{

   document.querySelectorAll(".cat")
    .forEach(x=>x.classList.remove("active"));

   btn.classList.add("active");

   category=btn.dataset.cat;

   render();

 };

});


/* ==========================================================
   SEARCH
   ========================================================== */

function doSearch(){

 search=searchInput.value.trim();
 render();

}

document.getElementById("searchBtn")
 .onclick=doSearch;

searchInput.addEventListener("keydown",e=>{
 if(e.key==="Enter")
   doSearch();
});

searchInput.addEventListener("input",()=>{

 if(searchInput.value===""){

   search="";
   render();

 }

});


/* ==========================================================
   ADD VIDEO
   ========================================================== */

document.getElementById("addOpen").onclick=()=>{
 addModal.classList.add("show");
 document.getElementById("addInput").focus();
};

document.getElementById("addCancel").onclick=()=>{
 addModal.classList.remove("show");
};


function getID(url){

 const patterns=[
   /youtube\.com\/watch\?v=([^&]+)/i,
   /youtu\.be\/([^?&]+)/i,
   /youtube\.com\/shorts\/([^?&]+)/i,
   /youtube\.com\/embed\/([^?&]+)/i
 ];

 for(const p of patterns){

   const m=url.match(p);

   if(m)return m[1];

 }

 return null;

}


document.getElementById("addConfirm").onclick=()=>{

 const input=document.getElementById("addInput");

 const id=getID(input.value.trim());

 if(!id){

   notify("Enter a valid YouTube video URL.");
   return;

 }

 if(videos.some(v=>v.id===id)){

   notify("This video is already added.");
   return;

 }

 const video={
   id:id,
   title:"New Kids Video",
   channel:"Added Video",
   category:"Kids",
   tags:"kids cartoon music learning vehicles"
 };

 videos.push(video);

 const savedNow=
   JSON.parse(localStorage.getItem("ytKidsAdded")||"[]");

 savedNow.push(video);

 localStorage.setItem(
   "ytKidsAdded",
   JSON.stringify(savedNow)
 );

 input.value="";
 addModal.classList.remove("show");

 notify("Video added!");

 render();

};


/* ==========================================================
   TOAST
   ========================================================== */

let toastTimer;

function notify(message){

 toast.textContent=message;
 toast.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer=setTimeout(()=>{
   toast.classList.remove("show");
 },2200);

}


/* ==========================================================
   MOBILE MENU
   ========================================================== */

document.getElementById("mobileMenu").onclick=()=>{

 document.getElementById("sidebar")
  .classList.toggle("open");

};


/* ==========================================================
   ESCAPE
   ========================================================== */

document.addEventListener("keydown",e=>{

 if(e.key==="Escape"){

   closePlayer();
   addModal.classList.remove("show");

 }

});


/* ==========================================================
   START
   ========================================================== */

render();

</script>

</body>
</html>
